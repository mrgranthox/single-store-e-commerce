steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/ecommerce/backend:$SHORT_SHA
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/ecommerce/backend:latest
      - .
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/ecommerce/backend:$SHORT_SHA
  - europe-west1-docker.pkg.dev/$PROJECT_ID/ecommerce/backend:latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
