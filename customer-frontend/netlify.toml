# Netlify: set this site’s “Base directory” to `customer-frontend` (repo root stays the Git root).
#
# VITE_BACKEND_BASE_URL is set below for GCP Cloud Run. If Site → Environment variables
# still has an older Render URL, remove or update it so it does not override this, then redeploy.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Vite inlines VITE_* at build time (public client config).
  VITE_BACKEND_BASE_URL = "https://ecommerce-api-mul3xofi6a-ew.a.run.app"
  SECRETS_SCAN_OMIT_KEYS = "VITE_BACKEND_BASE_URL,VITE_DEV_PROXY_TARGET,VITE_SENTRY_DSN,VITE_SENTRY_ENABLE_IN_DEV,VITE_SENTRY_TRACES_SAMPLE_RATE,VITE_APP_RELEASE"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; form-action 'self'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
